name: Verify Tara live Cloudflare build

on:
  push:
    paths:
      - '.github/workflows/check-tara-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - name: Verify taracalls.pages.dev serves v13.4.350 source fix
        shell: bash
        run: |
          set -euo pipefail
          base='https://taracalls.pages.dev'
          stamp=$(date +%s)
          curl -fsS --retry 3 -H 'Cache-Control: no-cache' "${base}/?verify=${stamp}" -o /tmp/tara-index.html
          asset=$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' /tmp/tara-index.html | head -n1)
          test -n "$asset"
          echo "Live asset: ${asset}"
          curl -fsS --retry 3 -H 'Cache-Control: no-cache' "${base}${asset}?verify=${stamp}" -o /tmp/tara-live.js
          grep -Fq 'Tara 13.4.350' /tmp/tara-live.js
          echo 'Verified version string: Tara 13.4.350'
          grep -Fq 'function _logSnapshotEntry(' /tmp/tara-live.js
          echo 'Verified hoisted helper: function _logSnapshotEntry(...)'
          if grep -Fq "const _logSnapshotEntry=" /tmp/tara-live.js; then
            echo 'Old TDZ-prone const declaration is still present in live bundle.' >&2
            exit 1
          fi
          echo 'VERIFIED: Cloudflare is serving the repaired v13.4.350 bundle and the old TDZ declaration is absent.'
