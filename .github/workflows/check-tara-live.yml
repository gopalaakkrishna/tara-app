name: Verify Tara live Cloudflare build

on:
  push:
    paths:
      - '.github/workflows/check-tara-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - name: Poll taracalls.pages.dev for v13.4.350 source fix
        shell: bash
        run: |
          set -u
          base='https://taracalls.pages.dev'
          for attempt in $(seq 1 36); do
            stamp=$(date +%s)
            echo "Attempt ${attempt}/36 at $(date -u +%FT%TZ)"
            html=$(curl -fsS --retry 2 -H 'Cache-Control: no-cache' "${base}/?verify=${stamp}" || true)
            asset=$(printf '%s' "$html" | grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' | head -n1 || true)
            if [ -z "$asset" ]; then
              echo '  Could not find Vite JS asset in live HTML.'
              sleep 10
              continue
            fi
            echo "  Live asset: ${asset}"
            js=$(curl -fsS --retry 2 -H 'Cache-Control: no-cache' "${base}${asset}?verify=${stamp}" || true)
            has_version=0
            has_hoist=0
            printf '%s' "$js" | grep -Fq 'Tara 13.4.350' && has_version=1 || true
            printf '%s' "$js" | grep -Fq 'function _logSnapshotEntry(' && has_hoist=1 || true
            echo "  Tara 13.4.350: ${has_version}; hoisted helper: ${has_hoist}"
            if [ "$has_version" -eq 1 ] && [ "$has_hoist" -eq 1 ]; then
              echo 'VERIFIED: Cloudflare is serving the repaired v13.4.350 bundle.'
              exit 0
            fi
            sleep 10
          done
          echo 'Cloudflare did not serve the repaired bundle within 6 minutes.' >&2
          exit 1
