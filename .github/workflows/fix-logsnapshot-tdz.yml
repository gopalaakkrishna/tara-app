name: Repair _logSnapshotEntry TDZ

on:
  push:
    paths:
      - '.github/workflows/fix-logsnapshot-tdz.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Repair source-level TDZ and remove temporary Vite shim
        shell: python
        run: |
          from pathlib import Path
          import re

          app_path = Path('src/App.jsx')
          raw = app_path.read_bytes()
          text = raw.decode('utf-8')

          # Match only the direct arrow declaration. If Tara was refactored into
          # useCallback or another shape, abort rather than guessing around
          # real-money trading code.
          pat = re.compile(
              r'(?m)^([ \t]*)const[ \t]+_logSnapshotEntry[ \t]*=[ \t]*(async[ \t]+)?(?:\(([^\r\n)]*)\)|([A-Za-z_$][\w$]*))[ \t]*=>[ \t]*\{'
          )
          matches = list(pat.finditer(text))
          if len(matches) != 1:
              # Print safe diagnostic context so the failure is actionable.
              idx = text.find('_logSnapshotEntry')
              context = text[max(0, idx-500):idx+1000] if idx >= 0 else '<not found>'
              raise SystemExit(f'Expected exactly one direct _logSnapshotEntry arrow declaration, found {len(matches)}. First context:\n{context}')

          m = matches[0]
          decl_pos = m.start()
          before = text[:decl_pos]
          pre_calls = len(re.findall(r'\b_logSnapshotEntry\s*\(', before))
          if pre_calls < 1:
              raise SystemExit('No _logSnapshotEntry call exists before its declaration; refusing to apply a TDZ fix to a different problem.')

          indent = m.group(1)
          async_kw = 'async ' if m.group(2) else ''
          params = m.group(3) if m.group(3) is not None else m.group(4)
          replacement = f'{indent}{async_kw}function _logSnapshotEntry({params}){{'
          text = text[:m.start()] + replacement + text[m.end():]

          # Bump only the presentation version. Do not touch BASELINE_VERSION or
          # trading-learning versions, because this patch changes no model logic.
          old_display = "const TARA_VERSION_DISPLAY='Tara 13.4.349';"
          new_display = "const TARA_VERSION_DISPLAY='Tara 13.4.350';"
          display_count = text.count(old_display)
          if display_count == 1:
              text = text.replace(old_display, new_display, 1)
          elif display_count != 0:
              raise SystemExit(f'Unexpected TARA_VERSION_DISPLAY count: {display_count}')

          app_path.write_bytes(text.encode('utf-8'))
          print(f'Hoisted _logSnapshotEntry; found {pre_calls} pre-declaration call(s).')
          print(f'TARA_VERSION_DISPLAY bumped: {display_count == 1}')

          vite_path = Path('vite.config.js')
          vite = vite_path.read_text(encoding='utf-8')
          start_marker = '// V13.4.350 emergency hotfix'
          end_marker = '// V8.8.4 — minification disabled'
          start = vite.find(start_marker)
          end = vite.find(end_marker)
          if start >= 0:
              if end <= start:
                  raise SystemExit('Found temporary Vite hotfix start marker but not its end marker.')
              vite = vite[:start] + vite[end:]
          old_plugins = 'plugins: [taraLogSnapshotTdzHotfix(), react()],'
          if old_plugins in vite:
              vite = vite.replace(old_plugins, 'plugins: [react()],', 1)
          elif 'plugins: [react()],' not in vite:
              raise SystemExit('Could not identify Vite plugin list while removing temporary hotfix.')
          vite_path.write_text(vite, encoding='utf-8')

      - name: Show exact source delta
        run: git diff --check && git diff -- src/App.jsx vite.config.js

      - name: Install dependencies
        run: npm ci

      - name: Clean production build
        run: npm run build

      - name: Verify built bundle contains hoisted helper
        shell: bash
        run: |
          set -euo pipefail
          test -d dist/assets
          if ! grep -R -F 'function _logSnapshotEntry(' dist/assets --include='*.js' >/dev/null; then
            echo 'Built bundle does not contain hoisted _logSnapshotEntry function.' >&2
            exit 1
          fi
          echo 'Verified: production bundle contains hoisted _logSnapshotEntry.'

      - name: Commit verified repair to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx vite.config.js
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 1
          fi
          git commit -m 'v13.4.350: hoist _logSnapshotEntry to fix startup TDZ'
          git push origin HEAD:main
