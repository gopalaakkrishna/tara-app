name: Deploy Tara to GitHub Pages

# Builds the Vite SPA and publishes dist/ to GitHub Pages on every push to main.
# The site is served at https://gopalaakkrishna.github.io/tara-app/ so the
# build uses that subpath as its base. API calls are sent to the host named in
# the repository variable VITE_API_BASE (Settings > Secrets and variables >
# Actions > Variables); leave it empty and the shim stays off.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_BASE: /tara-app/
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}

      # Pages has no SPA fallback; serving index.html for unknown paths keeps
      # deep links and stale PWA start URLs from landing on a 404 page.
      - run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
