name: Redirect old GitHub Pages URL to Netlify

# Tara now lives at https://taracalls.netlify.app. This workflow no longer
# builds the app; it publishes a one-page stub so the old Pages link
# (https://gopalaakkrishna.github.io/tara-app/) forwards there instead of
# serving a stale copy of the dashboard that would drift out of date.
#
# Delete this workflow, and disable Pages in the repo settings, once the old
# link is no longer in anyone's history or bookmarks.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  NEW_URL: https://taracalls.netlify.app/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build the redirect stub
        run: |
          mkdir -p out
          cat > out/index.html <<HTML
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Tara has moved</title>
              <meta http-equiv="refresh" content="0; url=${NEW_URL}" />
              <link rel="canonical" href="${NEW_URL}" />
              <style>
                body { margin: 0; min-height: 100vh; display: flex; align-items: center;
                       justify-content: center; background: #0A0C0F; color: #EDEDED;
                       font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
                a { color: #23B981; }
              </style>
            </head>
            <body>
              <p>Tara has moved to <a href="${NEW_URL}">${NEW_URL}</a></p>
            </body>
          </html>
          HTML
          cp out/index.html out/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
