<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0A0C0F" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Tara</title>
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // ══════════════════════════════════════════════════════════════════════
      // V13.4.189 — "OBSIDIAN" DESIGN SYSTEM.
      //
      // Bold redesign, requested as one system-wide pass rather than
      // screen-by-screen. What deliberately did NOT change, and why:
      //
      //   * Still a disciplined palette. V13.4.29 removed categorical
      //     multi-hue (sage/oxblood/indigo/...) on direct feedback that it
      //     "read as inconsistent rather than considered". Going bold here
      //     therefore means DEPTH, TYPE, ACCENT and MOTION -- not putting the
      //     rejected hues back. Every non-signal family still collapses to
      //     grayscale below.
      //   * Green and red are FUNCTIONAL SIGNALS, not decoration -- they are
      //     the one thing a restyle must not blur. They were Kalshi-sampled
      //     (#28CC95 / #FF4D6A) from V13.4.198 until V13.4.215 deepened them to
      //     #23B981 / #E8455E for legibility on this ground; see that note for
      //     the trade-off. Still signals-only, still never used for chrome.
      //
      // What DID change:
      //   * Base moved off flat neutral black to a layered near-black with a
      //     cool undertone (#050508 -> #22222E). v189 first shipped this ~1.6%
      //     away from the existing values, which made the whole redesign
      //     invisible in the mode actually in use -- see the V13.4.190 note on
      //     the tokens below. Corrected to a real 18/255 page-vs-card
      //     separation, roughly double what the app had before.
      //   * Accent lineage, for anyone wondering why it moved so much:
      //     gold (#C9A961/#D4A24C -> #E5C07B -> #F5C960) -> violet #A78BFA
      //     (V13.4.197, rejected) -> Kalshi brand green (V13.4.198) -> and then
      //     V13.4.206 made CHROME NEUTRAL entirely, because the accent had
      //     become the same colour as WIN and the two were indistinguishable.
      //     There is deliberately no chrome accent hue now: green and red mean
      //     outcomes, gold means sat-out, everything else is white at a tier.
      //   * Display typography: Space Grotesk is mapped onto `serif`, which
      //     restyles all 43 existing font-serif headings with zero component
      //     edits -- the single highest-leverage line in this file.
      //   * A real motion + elevation language (tokens below), replacing
      //     ad-hoc per-component transitions.
      // ══════════════════════════════════════════════════════════════════════
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              // Signals. Deepened in V13.4.215 from the Kalshi-sampled originals
              //   so the three states separate by brightness as well as hue.
              emerald: {
                200: '#9BE3C6', 300: '#5FD2AC', 400: '#23B981',
                500: '#1B9B70', 600: '#147558', 700: '#0F5742', 900: '#082E22',
              },
              teal: { 400: '#23B981' },
              rose: {
                200: '#F4B3BE', 300: '#EF8093', 400: '#E8455E',
                500: '#D62E45', 600: '#B02439',
              },
              red: { 400: '#E8455E' },
              pink: { 400: '#E8455E' },
              // These families are aliased onto the WIN green so no stray amber/
              //   orange/yellow can appear from a Tailwind class. Sit-out gold is
              //   NOT here -- it lives in T2_SITOUT in App.jsx, deliberately, so a
              //   utility class can never accidentally paint something sit-out.
              amber: { 300: '#6DD3B0', 400: '#23B981', 500: '#1A9770' },
              orange: { 400: '#23B981' },
              yellow: { 400: '#23B981' },
              // Everything else collapses to the cool grayscale ramp.
              indigo: { 100: '#E8E8ED', 300: '#B4B4BE', 400: '#8E8E9A', 500: '#6C6C78' },
              sky: { 200: '#D6D6DE', 300: '#B4B4BE', 400: '#8E8E9A', 500: '#6C6C78' },
              blue: { 300: '#B4B4BE', 400: '#8E8E9A', 500: '#6C6C78' },
              purple: { 300: '#B4B4BE', 400: '#8E8E9A', 500: '#6C6C78' },
              violet: { 200: '#D6D6DE', 300: '#B4B4BE', 400: '#8E8E9A', 500: '#6C6C78' },
              cyan: { 400: '#8E8E9A' },
            },
            fontFamily: {
              sans: ['"Instrument Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
              mono: ['"IBM Plex Mono"', 'ui-monospace', 'monospace'],
              // The leverage line: 43 existing font-serif headings become the
              // display face without touching a single component.
              serif: ['"Space Grotesk"', '"Instrument Sans"', 'ui-sans-serif', 'sans-serif'],
            },
          },
        },
      };
    </script>
    <style>
      /* ── Design tokens ─────────────────────────────────────────────────── */
      :root {
        /* Surfaces, dark -> light. Cool undertone gives depth to big blacks. */
        /* V13.4.190: v189's values were within ~1.6% of what the app already
           had, so the "redesign" was invisible in the mode actually in use, and
           page-vs-card separation even dropped from 10/255 to 9/255. These are
           the corrected values: the page goes properly black, cards lift clearly
           off it (18/255 separation, ~2x the old), and hairlines become visible
           edges rather than the near-invisible 4% they were. */
        /* V13.4.197: the base is now INDIGO, not neutral black. A hue in the
           ground plane is what separates the reference dashboards from a plain
           dark theme -- neutral greys read as "unstyled dark mode". */
        /* V13.4.198: sampled from kalshi.com's live tokens so the app sits in
           the same colour world as the exchange it trades on. */
        /* V13.4.299: reverted to the APPROVED MOCKUP's palette. The Kalshi
           indigo ground (#0A0C0F / #151A21) fought App.jsx, which already
           hardcodes the mockup's neutral values in 250+ places (#050508 page,
           #0A0A0E panel, #1B1B22 border). Two palettes were rendering at once
           and the indigo one owned the page background. Mockup wins: it is the
           design that was approved. See project_tara_dashboard_mockup_rebuild. */
        --bg-0: #050508;   /* mockup page background */
        --bg-1: #0A0A0E;   /* mockup panel background */
        --bg-2: #101017;   /* one step up, same neutral world */
        --bg-3: #16161c;   /* overlay / popover, = mockup divider tone */

        /* Hairlines — the mockup's actual edge tones, not white alphas. */
        --line-1: #16161c;   /* inner dividers */
        --line-2: #1B1B22;   /* panel border */
        --line-3: #2A2A34;   /* strongest edge (mockup uses this for chips) */

        /* Ink */
        /* V13.4.200: the secondary tiers were sitting low enough that every
           label read as a grey haze over the card rather than as text. Lifted;
           ink-1 stays at Kalshi's --text-x10 so primary values are unchanged. */
        /* V13.4.299: mockup ink is #EDEDED-based, not pure white — App.jsx
           already uses rgba(237,237,237,…) in over a thousand places, so pure
           white here made chrome read colder than the content it framed. The
           four tiers below are the mockup's .k / .k2 / body / heading opacities. */
        --ink-1: rgba(237,237,237,0.92);
        --ink-2: rgba(237,237,237,0.82);
        --ink-3: rgba(237,237,237,0.46);  /* = mockup .k2 */
        --ink-4: rgba(237,237,237,0.30);  /* = mockup .k  */

        /* Signals + signature */
        --up: #23B981;
        --down: #E8455E;
        /* NOTE: --accent is the same value as --up on purpose; it is used only
           where an accent IS a positive signal. Chrome does not use it at all
           since V13.4.206 -- see the lineage note above. */
        --accent: #23B981;      /* deepened WIN green (was Kalshi #28CC95) */
        --accent-hi: #4FC79E;   /* deepened bright tier (was Kalshi #5CD8AE) */
        --accent-glow: rgba(35, 185, 129, 0.16);
        --accent-border: rgba(35, 185, 129, 0.42);

        /* Elevation */
        --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.4);
        --shadow-2: 0 4px 16px rgba(0, 0, 0, 0.45), 0 1px 2px rgba(0, 0, 0, 0.5);
        --shadow-3: 0 12px 40px rgba(0, 0, 0, 0.55), 0 2px 6px rgba(0, 0, 0, 0.5);
        --glow-accent: 0 0 26px rgba(35, 185, 129, 0.18);

        /* Motion — one language, used everywhere */
        --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
        --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
        --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        --dur-1: 120ms;
        --dur-2: 200ms;
        --dur-3: 340ms;
      }

      html, body {
        font-family: 'Instrument Sans', ui-sans-serif, system-ui, sans-serif;
        background: var(--bg-0);
        color: var(--ink-1);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      /* V13.4.299: the accent bloom and film grain are both GONE. The approved
         mockup is a flat #050508 ground with no lighting effect and no texture
         — its separation comes from hairlines and panel fills alone. A green
         radial bloom behind everything also quietly broke the mockup's one
         accent rule (green means an outcome), by tinting the whole page green. */

      /* ══════════════════════════════════════════════════════════════════
         V13.4.191 TYPE SCALE.
         Measured first: 297/322 rendered text elements were 7-12px, giving the
         page a flat, dense texture with no hierarchy. Recolouring could never
         fix that. This rebuilds the scale globally.

         Small sizes move up modestly (+1 to +1.5px) -- 8-9px is below
         comfortable reading and was the app's most common size. Hero numerals
         move up hard, because contrast between smallest and largest is what
         makes a layout read as designed rather than as a data dump. Ratio goes
         from 7:60 to 9:70.

         !important is deliberate: these override Tailwind's generated utility
         classes, which is the only way to restyle ~1,500 call sites without
         editing 1,500 call sites. To revert the whole thing, delete this block.

         LAYOUT RISK, stated plainly: bigger text in fixed-width columns can
         wrap or overflow. The bump was kept modest for exactly that reason,
         and the app was checked for overflow after. */
      /* V13.4.197: reported still small. Whole scale steps up again; the floor
         moves from 9px to 10.5px, which is the real readability threshold for
         sustained on-screen use. */
      .text-\[7px\]  { font-size: 7px !important; line-height: 1.5 !important; }
      .text-\[8px\]  { font-size: 8px !important;   line-height: 1.5 !important; }
      .text-\[9px\]  { font-size: 9px !important;   line-height: 1.5 !important; }
      .text-\[10px\] { font-size: 10px !important; line-height: 1.5 !important; }
      .text-\[11px\] { font-size: 11px !important; line-height: 1.5 !important; }
      .text-\[12px\] { font-size: 12px !important; line-height: 1.5 !important; }
      .text-\[13px\] { font-size: 13px !important;   line-height: 1.5 !important; }
      .text-xs        { font-size: 12px !important; line-height: 1.5 !important; }
      .text-sm        { font-size: 14px !important;   line-height: 1.5 !important; }

      /* Hero numerals: the hierarchy anchor. Tight tracking + lighter weight is
         what makes a large number read as considered rather than merely big. */
      /* V13.4.299: sizes pulled back toward the mockup, tracking kept. The
         mockup's whole hierarchy tops out around 27px (the price, the UP call,
         the conviction figure); this scale ran to 70px, so a single number could
         out-shout an entire column. Back to roughly Tailwind's own steps. */
      .text-2xl { font-size: 24px !important; letter-spacing: -0.03em !important; }
      .text-3xl { font-size: 28px !important; letter-spacing: -0.035em !important; }
      .text-4xl { font-size: 34px !important; letter-spacing: -0.04em !important; }
      .text-5xl { font-size: 42px !important; letter-spacing: -0.042em !important; }
      .text-6xl { font-size: 52px !important; letter-spacing: -0.045em !important; }

      /* Micro-labels earn their size back through tracking, which is how small
         caps are supposed to work and how they stop reading as cramped. */
      /* V13.4.299: 0.09em -> 0.15em, the mockup's .k tracking. "Labels are tiny
         caps" is one of the brief's four stated rules, and tracking is most of
         what makes a 9px cap read as a label rather than as shouted body text. */
      .uppercase { letter-spacing: 0.15em !important; }

      /* V13.4.194: radii taken from the reference dashboards -- their most
         recognisable trait is how round the cards are against true black.
         Buttons/chips become true pills; panels get a large, soft radius. */
      /* V13.4.299 REVERSED. This block was the single biggest reason the live
         page did not look like the approved mockup, whose brief says in as many
         words: "hairline panels instead of same-size rounded pills". Measured
         side by side, the live page had 48 bordered-and-filled pill chips to
         the mockup's 2, and its dominant radii were 18px and 9999px against the
         mockup's 3px and 10px.
         The button/anchor line is the one that did the damage: it forced EVERY
         button to a full pill no matter which radius class it asked for, so
         chips like "TEL 47/50", "WARM" and "you · 64%" became lozenges. It is
         deleted. .rounded-full stays at 9999px (Tailwind's own default) because
         genuinely circular things -- status dots, the stage number discs, avatar
         slots -- legitimately use it. */
      .rounded-lg  { border-radius: 10px !important; }  /* = mockup .panel */
      .rounded-xl  { border-radius: 12px !important; }
      .rounded-2xl { border-radius: 14px !important; }

      /* Display face: tighter tracking so headings read as designed, not default. */
      .font-serif {
        letter-spacing: -0.02em;
        font-weight: 600;
      }

      /* Numerics never reflow mid-tick. */
      /* V13.4.299: "Numbers are mono" is the brief's third rule. App.jsx already
         marks its 313 numeric sites with tabular-nums, so routing that class to
         the mono face applies the rule everywhere at once instead of editing 313
         call sites. IBM Plex Mono is already loaded and configured as font-mono,
         so this costs no extra request. Tracking matches the mockup's .m. */
      .tabular-nums, [class*='tabular'] {
        font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-variant-numeric: tabular-nums;
        font-feature-settings: 'tnum' 1;
        letter-spacing: -0.015em;
      }

      /* One interaction language instead of per-component transitions. */
      button, a, [role='button'] {
        transition:
          background-color var(--dur-2) var(--ease-out),
          border-color var(--dur-2) var(--ease-out),
          color var(--dur-2) var(--ease-out),
          box-shadow var(--dur-2) var(--ease-out),
          transform var(--dur-1) var(--ease-out),
          opacity var(--dur-2) var(--ease-out);
      }
      button:not(:disabled):active, [role='button']:not(:disabled):active {
        transform: scale(0.975);
      }
      button:focus-visible, a:focus-visible, [role='button']:focus-visible {
        outline: none;
        box-shadow: 0 0 0 2px var(--bg-0), 0 0 0 3.5px var(--accent-border);
      }

      /* Scrollbars, so overflow areas match the rest of the surface. */
      * { scrollbar-width: thin; scrollbar-color: var(--line-3) transparent; }
      *::-webkit-scrollbar { width: 9px; height: 9px; }
      *::-webkit-scrollbar-track { background: transparent; }
      *::-webkit-scrollbar-thumb {
        background: var(--line-2);
        border-radius: 999px;
        border: 2px solid transparent;
        background-clip: content-box;
      }
      *::-webkit-scrollbar-thumb:hover { background: var(--line-3); background-clip: content-box; }

      ::selection { background: rgba(217, 179, 104, 0.26); color: #fff; }

      /* Entrance for modals/overlays. */
      @keyframes t2-fade-up {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .fixed.inset-0 > * { animation: t2-fade-up var(--dur-3) var(--ease-out) both; }

      /* A locked call should feel alive without being noisy. */
      @keyframes t2-pulse-accent {
        0%, 100% { box-shadow: 0 0 0 0 rgba(217, 179, 104, 0.28); }
        50%      { box-shadow: 0 0 0 6px rgba(217, 179, 104, 0); }
      }
      .t2-live { animation: t2-pulse-accent 2.4s var(--ease-in-out) infinite; }

      /* Respect the OS setting — never fight accessibility preferences. */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('%BASE_URL%sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
