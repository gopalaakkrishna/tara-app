# Netlify build settings for the Tara frontend.
#
# Tara is a Vite single-page app. Netlify serves it at the root of its own
# hostname, so there is no base path to set here (the GitHub Pages deploy
# needed VITE_BASE=/tara-app/ because a project site lives on a subpath).
#
# VITE_API_BASE points the app's /api/* calls at the Node service in the
# tara-kalshi-proxy repo. Set it in Site configuration > Environment variables
# so it can change without editing this file.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: serve index.html for any path that is not a real file, so
# deep links and a stale PWA start URL do not land on Netlify's 404 page.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The bundle filename is content-hashed, so it can be cached indefinitely.
# index.html must not be, or browsers keep loading the old bundle after a deploy.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
