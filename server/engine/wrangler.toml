# Tara always-on Call engine on Cloudflare's FREE plan (step 2 of the plan).
# Personal Cloudflare account only (same as taracalls.pages.dev,
# tara-sports-refresh and tara-feed-probe). Never the Evolve Pictures account.
name = "tara-engine"
main = "src/index.js"
compatibility_date = "2026-10-01"
account_id = "5bd757dd1285beb06bf95ef9e2962c6b"
workers_dev = true
preview_urls = false

# Watchdog: once a minute, wake the engine and re-arm its alarm if needed.
# Free accounts get 5 cron triggers; tara-sports-refresh uses 1.
[triggers]
crons = ["* * * * *"]

[[durable_objects.bindings]]
name = "ENGINE"
class_name = "TaraEngine"

# Free plan Durable Objects must use the SQLite storage backend.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["TaraEngine"]

# Public values: the same URL and anon key ship in tara-app's src/App.jsx.
# ENGINE_MODE must stay "shadow": the engine refuses to start otherwise.
[vars]
SUPABASE_URL = "https://vhbbkqmyyzddhezdgszm.supabase.co"
SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZoYmJrcW15eXpkZGhlemRnc3ptIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3ODMzNjUsImV4cCI6MjA5NDM1OTM2NX0.30zC6hbGEcCNSuOQNRfh81_3B0nwVDuUJeeqUydZCoM"
ENGINE_MODE = "shadow"

[observability]
enabled = true
